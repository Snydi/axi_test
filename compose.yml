name: axi-test

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-axi_test}
      DB_USERNAME: ${POSTGRES_USER:-axi}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-axi_local_password}
    volumes:
      - ./backend:/app
      - maven_cache:/root/.m2
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/actuator/health > /dev/null"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 20s
    networks:
      - axi_network

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1:5173/"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - axi_network

  nginx:
    image: nginx:1.29-alpine
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - axi_network

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-axi_test}
      POSTGRES_USER: ${POSTGRES_USER:-axi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-axi_local_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - axi_network

volumes:
  maven_cache:
  node_modules:
  postgres_data:

networks:
  axi_network:
    driver: bridge
