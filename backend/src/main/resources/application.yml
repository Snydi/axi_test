spring:
  application:
    name: axi-test-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/axi_test}
    username: ${DB_USERNAME:axi}
    password: ${DB_PASSWORD:axi_local_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info

